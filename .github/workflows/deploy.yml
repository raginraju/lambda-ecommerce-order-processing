name: Deploy Poultry Shop

on:
  push:
    branches: [ main, test ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Automatically switches between 'prod' and 'test' environments in GitHub
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install -g aws-cdk
          pip install -r requirements.txt
          cd frontend && npm install && cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Set Environment Stage
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "STAGE=prod" >> $GITHUB_ENV
          else
            echo "STAGE=test" >> $GITHUB_ENV
          fi

      # Step 1: Deploy Infrastructure (API, Auth, and the two S3 Buckets)
      - name: Deploy Infrastructure
        run: |
          # Create a placeholder to allow CDK synthesis to pass
          mkdir -p frontend/dist
          touch frontend/dist/placeholder.txt
          
          cdk deploy "${{ env.STAGE }}-PoultryInfraStack" \
            -c stage=${{ env.STAGE }} \
            --require-approval never \
            --exclusively \
            --outputs-file outputs.json

      # Step 2: Build Frontend with the newly generated AWS Context
      - name: Build Frontend
        run: |
          # Parse the EXACT keys from your updated PoultryInfraStack CfnOutputs
          VITE_API_URL=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".VITE_API_URL" outputs.json)
          VITE_USER_POOL=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".VITE_COGNITO_USER_POOL_ID" outputs.json)
          VITE_CLIENT_ID=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".VITE_COGNITO_CLIENT_ID" outputs.json)
          VITE_CDN_URL=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".VITE_CDN_URL" outputs.json)
          
          # Dynamically create the .env file for the Vite build
          echo "VITE_API_URL=$VITE_API_URL" > frontend/.env
          echo "VITE_COGNITO_USER_POOL_ID=$VITE_USER_POOL" >> frontend/.env
          echo "VITE_COGNITO_CLIENT_ID=$VITE_CLIENT_ID" >> frontend/.env
          echo "VITE_CDN_URL=$VITE_CDN_URL" >> frontend/.env
          
          # Add Static Auth Config
          echo "VITE_COGNITO_REGION=ap-southeast-1" >> frontend/.env
          echo "VITE_COGNITO_API_URL=https://cognito-idp.ap-southeast-1.amazonaws.com/" >> frontend/.env
          
          cd frontend
          npm run build
          cd ..

      # Step 3: Sync Product Images to the dedicated Images Bucket
      - name: Sync Product Images
        run: |
          # Grab the dynamic bucket name for the images origin
          IMG_BUCKET=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".ImagesBucketName" outputs.json)
          
          aws s3 sync ./frontend/public/images s3://$IMG_BUCKET/images \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # Step 4: Final Deploy - Upload the built React app to S3/CloudFront
      - name: Deploy Frontend Assets
        run: |
          cdk deploy "${{ env.STAGE }}-PoultryDeployStack" \
            -c stage=${{ env.STAGE }} \
            --require-approval never \
            --exclusively