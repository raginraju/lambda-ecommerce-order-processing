name: Deploy Poultry Shop

on:
  push:
    branches: [ main, test ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'test' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          npm install -g aws-cdk
          pip install -r requirements.txt
          cd frontend && npm install && cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Set Environment Stage
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "STAGE=prod" >> $GITHUB_ENV
          else
            echo "STAGE=test" >> $GITHUB_ENV
          fi

      # Step 1: Deploy Infrastructure
      - name: Deploy Infrastructure
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/placeholder.txt
          
          cdk deploy "${{ env.STAGE }}-PoultryInfraStack" \
            -c stage=${{ env.STAGE }} \
            --require-approval never \
            --exclusively \
            --outputs-file outputs.json

      # Step 2: Build Frontend
      - name: Build Frontend
        run: |
          # 1. Parse the IDs from outputs.json
          RAW_API_URL=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".ViteApiUrlOutput" outputs.json)
          VITE_CDN_URL=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".ViteCdnUrlOutput" outputs.json)
          USER_POOL=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".UserPoolId" outputs.json)
          CLIENT_ID=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".UserPoolClientId" outputs.json)
          
          # 2. Clean the API URL
          VITE_API_URL=$(echo $RAW_API_URL | sed 's/\/$//')

          # 3. Create the .env file (CRITICAL FIX HERE)
          echo "VITE_API_URL=$VITE_API_URL" > frontend/.env
          echo "VITE_CDN_URL=$VITE_CDN_URL" >> frontend/.env
          echo "VITE_COGNITO_USER_POOL_ID=$USER_POOL" >> frontend/.env
          echo "VITE_COGNITO_CLIENT_ID=$CLIENT_ID" >> frontend/.env
          
          # Add the specific variables your error log is complaining about
          echo "VITE_COGNITO_REGION=ap-southeast-1" >> frontend/.env
          echo "VITE_COGNITO_API_URL=https://cognito-idp.ap-southeast-1.amazonaws.com/" >> frontend/.env
          
          # 4. Run the build
          cd frontend
          npm run build

      # Step 3: Sync Product Images ONLY
      - name: Sync Product Images
        run: |
          IMG_BUCKET=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".ImagesBucketName" outputs.json)
          
          # Only sync images. Your live products.json in S3 is now safe.
          aws s3 sync ./frontend/public/images s3://$IMG_BUCKET/images \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # Step 4: Final Deploy - Upload React build to the UI Bucket
      - name: Deploy Frontend Assets
        run: |
          cdk deploy "${{ env.STAGE }}-PoultryDeployStack" \
            -c stage=${{ env.STAGE }} \
            --require-approval never \
            --exclusively

      # Step 5: Invalidate CloudFront Cache (Force instant update)
      - name: Invalidate CloudFront
        run: |
          # Use the Logical ID of the Distribution from your outputs
          DIST_ID=$(jq -r ".\"${{ env.STAGE }}-PoultryInfraStack\".ExportsOutputRefPoultryCombinedDistC6A3EE35A706DE97" outputs.json)
          aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"